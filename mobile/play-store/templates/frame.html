<!doctype html>
<!--
  One Play phone screenshot, 1080 x 1920: a caption over a real capture of the
  app. Rendered by mobile/scripts/store-shots.mjs, which passes the capture and
  the three lines of the caption in the address:

    frame.html?shot=../raw/rate.png&title=...&urdu=...&sub=...

  The capture is never redrawn or edited here, only placed and scaled.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Noto+Nastaliq+Urdu:wght@500&display=block"
    />
    <style>
      :root {
        --green: #0a3723;
        --green-deep: #06281a;
        --green-lift: #11553a;
        --gold: #c1a057;
        --gold-light: #e2c47c;
        --ivory: #f9f6f2;
        --champagne: #e6daba;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: radial-gradient(130% 75% at 50% 0%, var(--green-lift) 0%, var(--green) 48%, var(--green-deep) 100%);
        font-family: Inter, sans-serif;
      }

      /* The hairline frame the shop puts round its rate board. */
      .edge {
        position: absolute;
        inset: 30px;
        border: 2px solid rgb(193 160 87 / 0.42);
        border-radius: 8px;
      }

      .brand {
        position: absolute;
        top: 82px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 27px;
        letter-spacing: 0.4em;
        color: var(--gold);
        text-transform: uppercase;
      }

      .brand img {
        width: 40px;
        height: auto;
      }

      .copy {
        position: absolute;
        top: 156px;
        left: 92px;
        right: 92px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-weight: 500;
        font-size: 80px;
        line-height: 1.04;
        color: var(--ivory);
      }

      .urdu {
        margin: 18px 0 0;
        direction: rtl;
        font-family: "Noto Nastaliq Urdu", serif;
        font-weight: 500;
        font-size: 42px;
        line-height: 2;
        color: var(--gold-light);
      }

      /* Nastaliq hangs well below its line; the gap is for its descenders. */
      .sub {
        margin: 34px auto 0;
        max-width: 820px;
        font-size: 31px;
        line-height: 1.38;
        color: rgb(230 218 186 / 0.9);
      }

      /* The phone: the capture inside a dark bezel and a thin gold ring. */
      .phone {
        position: absolute;
        left: 50%;
        bottom: 70px;
        width: 676px;
        transform: translateX(-50%);
        padding: 14px;
        border-radius: 58px;
        background: #0f0f0e;
        box-shadow:
          0 0 0 2px rgb(193 160 87 / 0.65),
          0 40px 90px rgb(0 0 0 / 0.45);
      }

      .phone img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 44px;
      }
    </style>
  </head>
  <body>
    <div class="edge"></div>

    <div class="brand">
      <img src="../../../src/assets/brand/mark.svg" alt="" />
      Al-Madina Jewellers
    </div>

    <div class="copy">
      <h1 id="title"></h1>
      <p class="urdu" id="urdu" lang="ur"></p>
      <p class="sub" id="sub"></p>
    </div>

    <div class="phone"><img id="shot" alt="" /></div>

    <script>
      const params = new URLSearchParams(location.search);
      for (const id of ["title", "urdu", "sub"]) {
        document.getElementById(id).textContent = params.get(id) ?? "";
      }
      document.getElementById("shot").src = params.get("shot") ?? "";
    </script>
  </body>
</html>
