<!doctype html>
<!--
  The Play feature graphic, 1024 x 500, around a real capture of the rate
  board (../raw/rate.png). Rendered by mobile/scripts/store-shots.mjs.

  Play crops and overlays this in places — a play button on a promo video, the
  corners on some surfaces — so the words stay well inside the edges.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@500;600&family=Noto+Nastaliq+Urdu:wght@500&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: radial-gradient(90% 120% at 78% 30%, #11553a 0%, #0a3723 50%, #06281a 100%);
        font-family: Inter, sans-serif;
      }

      .edge {
        position: absolute;
        inset: 18px;
        border: 1.5px solid rgb(193 160 87 / 0.42);
        border-radius: 4px;
      }

      .copy {
        position: absolute;
        left: 74px;
        top: 74px;
        width: 560px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 0.38em;
        color: #c1a057;
        text-transform: uppercase;
      }

      .brand img {
        width: 34px;
      }

      h1 {
        margin: 28px 0 0;
        font-family: "Cormorant Garamond", serif;
        font-weight: 500;
        font-size: 58px;
        line-height: 1.02;
        color: #f9f6f2;
      }

      .urdu {
        margin: 8px 0 0;
        direction: rtl;
        text-align: left;
        font-family: "Noto Nastaliq Urdu", serif;
        font-weight: 500;
        font-size: 30px;
        line-height: 2;
        color: #e2c47c;
      }

      .tags {
        margin: 10px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgb(230 218 186 / 0.85);
      }

      /* Runs off the foot of the graphic, so the board reads as a phone held up. */
      .phone {
        position: absolute;
        right: 92px;
        top: 52px;
        width: 262px;
        padding: 8px;
        border-radius: 34px;
        background: #0f0f0e;
        box-shadow:
          0 0 0 1.5px rgb(193 160 87 / 0.65),
          0 26px 60px rgb(0 0 0 / 0.5);
      }

      .phone img {
        display: block;
        width: 100%;
        border-radius: 26px;
      }
    </style>
  </head>
  <body>
    <div class="edge"></div>

    <div class="copy">
      <div class="brand">
        <img src="../../../src/assets/brand/mark.svg" alt="" />
        Al-Madina Jewellers
      </div>
      <h1>Today&rsquo;s gold rate in Pakistan</h1>
      <p class="urdu" lang="ur">آج کا سونے کا ریٹ</p>
      <p class="tags">Hallmarked jewellery &middot; Sell gold &middot; Mandi Bahauddin</p>
    </div>

    <div class="phone"><img src="../raw/rate.png" alt="" /></div>
  </body>
</html>
