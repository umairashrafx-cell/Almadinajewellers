<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No viewport-fit=cover, deliberately. Capacitor reads this tag: without it
      the WebView is inset by the status and gesture bars instead of drawn
      behind them, which is what the website expects and what keeps the header
      clear of the clock.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B3D2E" />
    <title>Al-Madina Jewellers</title>

    <!--
      Dark, if that is what was chosen, before the first paint.

      Everything else waits for the bundle; this cannot. A dark app that
      opened ivory and then turned would flash white in somebody's face every
      time they launched it at night, which is the one time the setting
      matters. So the choice is read here from a single word in storage,
      written by src/lib/settings.ts whenever the setting changes, and the
      class is on the page before the stylesheet has anything to draw.

      Wrapped, because storage can be switched off and this must never be the
      reason the app fails to open.
    -->
    <script>
      try {
        var theme = localStorage.getItem("amj:theme");
        var phone = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (theme === "phone" && phone)) {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {}
    </script>

    <!--
      The shop's typefaces, from the same place the website gets them. With no
      connection they simply do not arrive and the screens fall back to the
      phone's own faces — the figures are still the figures.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@400;500;600&family=Montserrat:wght@500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
