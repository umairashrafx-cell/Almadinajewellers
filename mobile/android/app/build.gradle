apply plugin: 'com.android.application'

/*
 * The upload key, when there is one to hand.
 *
 * keystore.properties sits next to this project and is never committed — see
 * .gitignore. It names the keystore file and holds its passwords:
 *
 *   storeFile=C:/path/to/android.keystore
 *   storePassword=...
 *   keyAlias=...
 *   keyPassword=...
 *
 * It has to be the same upload key the Trusted Web Activity was signed with
 * (SHA-256 2B:4B:…:FA:EB — mobile/play-store/README.md lists it). Play accepts
 * an update to this listing only from that key.
 *
 * Without the file the release bundle still builds, unsigned, which is enough
 * to prove it compiles.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.almadinajeweller.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.almadinajeweller.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * Play takes an update only if versionCode is higher than the live one.
         * The Play Console showed 3 live on 8 November 2026, so this is 4.
         *
         * Until then this comment said production was on 2, and it was wrong:
         * 3 had already gone out. A signed bundle was built against it and
         * would have been rejected at upload. So read the live number off the
         * Console before every release — what is written here is a note of
         * what was true once, not a source of truth.
         *
         * versionName is what a customer sees: the second app.
         */
        versionCode 4
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            /*
             * R8 shrinks and optimises the Java side of the release build.
             *
             * Almost none of what is linked in is used: the app is one empty
             * Activity over a WebView, and appcompat, Firebase and the two
             * Capacitor plugins drag in far more than it calls. Without this
             * the bundle ships every class of all of them.
             *
             * Capacitor finds its plugins by reflection, so the classes it
             * instantiates have to survive, and they do without a rule being
             * written here: capacitor-android declares its keep rules as
             * consumerProguardFiles, so Gradle applies them to this build on
             * its own (node_modules/@capacitor/android/capacitor/
             * proguard-rules.pro keeps everything extending
             * com.getcapacitor.Plugin and the annotations read at runtime).
             * Firebase ships its rules the same way, and the classes named in
             * AndroidManifest.xml are kept by the keep rules AGP generates
             * from the manifest. proguard-rules.pro next to this file is
             * therefore still empty, and -optimize is the variant of the
             * default file Capacitor's own libraries build against.
             *
             * Resource shrinking is deliberately left off. The app's screens
             * live in assets/, which it does not look at, so it would trim
             * only the Android resources of libraries that are already gone
             * after this — risk without much to gain.
             */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
